[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-author"
version = "0.1.0"
description = "Inspect author metadata in JPEG photos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
photo-author = "photo_author.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
